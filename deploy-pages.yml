  <div>ŞEFFAFLIK</div><h1>Bilgiyi nasıl hazırlıyoruz?</h1>
  <p>DestekSinyali, farklı kurumlarda yayımlanan fırsatları tek yerde görmenizi kolaylaştıran bağımsız bir bilgi hizmetidir. Bir kamu kurumu veya başvuru danışmanı değildir.</p>
  <h2>1. Yalnızca resmî kaynağı esas alıyoruz</h2><p>Bir fırsatı yayımlamadan önce duyuru bağlantısının ilgili kamu kurumuna ait olduğunu kontrol ediyoruz. Blog yazıları ve sosyal medya paylaşımları tek başına kaynak kabul edilmez.</p>
  <div class="sources"><div class="source"><a href="https://tubitak.gov.tr/tr/duyuru" target="_blank" rel="noopener">TÜBİTAK duyuruları</a></div><div class="source"><a href="https://www.kosgeb.gov.tr/site/tr/genel/liste/2/duyurular" target="_blank" rel="noopener">KOSGEB duyuruları</a></div><div class="source"><a href="https://ticaret.gov.tr/destekler" target="_blank" rel="noopener">T.C. Ticaret Bakanlığı destekleri</a></div></div>
  <h2>2. Kritik bilgileri ayrı ayrı kontrol ediyoruz</h2><ul><li>Başvuruya kimlerin katılabileceği</li><li>Son başvuru ve varsa ön kayıt tarihi</li><li>Başvurunun açık olup olmadığı</li><li>Resmî duyuru bağlantısının çalışıp çalışmadığı</li></ul>
  <h2>3. Yorumu kaynaktan ayırıyoruz</h2><p>Kısa özet ve “ilk adım” bölümü, uzun çağrı metnini anlamayı kolaylaştırır. Nihai uygunluk kararı değildir. Her fırsatta resmî duyuru bağlantısını açıkça gösteririz.</p>
  <h2>4. Güncelliği görünür tutuyoruz</h2><p>Her kayıtta son kontrol tarihini yayımlarız. Tarihi geçmiş veya doğrulanamayan fırsatları açık fırsat listesinden çıkarmayı hedefleriz.</p>
  <p class="note"><strong>Bir hata mı gördünüz?</strong><br>Kaynak bağlantısıyla birlikte <a href="mailto:desteksinyali@gmail.com?subject=DestekSinyali%20bilgi%20düzeltme">desteksinyali@gmail.com</a> adresine bildirebilirsiniz.</p>
